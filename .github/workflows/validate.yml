name: validate

# Boundary gate for Math-Multiverse.html and the content packs: unit suites, pack validation,
# independent-oracle math fuzz, and headless render smoke. Content is gated first, before anything
# slower runs. Runs on every PR and on pushes to main; required for merge via branch protection.
# The job id and its `name:` are what branch protection matches on -- do not rename them.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fuzz-and-smoke:
    name: fuzz + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (readability, targets, validator, verdicts, items, pack, runner)
        run: npm run units

      - name: Validate content packs (structure, verbatim spans, readability, blind-verdict ledger)
        run: node tests/validate-pack.js

      - name: Curriculum crosswalk gate (CC1 lesson map; emitted-topic check, gap count, 5 controls)
        run: node tests/validate-curriculum.js

      - name: Figure-derive gate (regenerated chart SVGs byte-match their committed src; fixture controls)
        run: node tests/figure-derive.js

      - name: Freshness unit gate (MVFresh service, module-grade union rejection)
        run: node tests/freshness.js

      - name: Shell literal-digit scan (static + sigOf shell-invariance behavioral check)
        run: node tests/shells.js

      - name: Freshness binding gate (per-driver content-pool depth estimate)
        run: node tests/freshness-lib.js

      - name: Freshness seeded sim gate (10-run + campaign replay, real drawRun path)
        run: node tests/freshness-sim.js

      - name: Math fuzz (independent-oracle, ~360k questions, all modules G5+G6)
        run: node tests/fuzz.js

      - name: Install Chromium for smoke
        run: npx playwright install --with-deps chromium

      - name: Headless render smoke (launcher + all six modules, Grade 5 and Grade 6)
        run: node tests/smoke.js

      - name: Figures offline (every figure/badge asset decodes with no network; fixture controls)
        run: node tests/figures-offline.js

      - name: Reading surface (every pack item keeps a readable passage at 1024x768)
        run: node tests/reading-surface.js

      - name: Tile overlap (occlusion-corrected, explain tile never paints over sibling chrome)
        run: node tests/tile-overlap.js

      - name: Touch targets (every header control reachable by a 44px finger, hit-tested)
        run: node tests/touch-targets.js

      - name: Reduced motion (no SMIL in art; every animated asset stops under reduce)
        run: node tests/reduced-motion.js

      - name: Curriculum pointer (grade flip, reload, weekday advance, legacy save; 5 controls)
        run: node tests/curriculum-pointer.js

      - name: Today's Mission (60/40 blend, pointer shift, cross-grade, TOPIC_INDEX freshness; 6 controls)
        run: node tests/mission.js

      - name: Resume a level (exit mid-run and return continues it; 3 controls)
        run: node tests/resume-level.js
