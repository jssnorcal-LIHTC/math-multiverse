<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
<rect x="0" y="0" width="800" height="500" fill="#0f1218" />
<text x="400" y="30" font-size="22" fill="#e8eef7" text-anchor="middle" font-weight="700">Three proposals for Halyard Point</text>
<text x="400" y="58" font-size="16" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">Every proposal is checked against three tests:</text>
<text x="400" y="78" font-size="15" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">effect within one season, cost within budget, Network's own authority</text>

<rect x="30" y="100" width="240" height="380" rx="10" fill="#12161d" stroke="#e8eef7" stroke-width="2" />
<text x="150" y="132" font-size="18" fill="#e8eef7" text-anchor="middle" font-weight="700">Proposal A</text>
<text x="150" y="154" font-size="15" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">Feeding station</text>
<text x="50" y="210" font-size="15"><tspan fill="#1a8f5e" font-weight="700">YES</tspan><tspan fill="#e8eef7">: within budget</tspan></text>
<text x="50" y="230" font-size="15"><tspan fill="#1a8f5e" font-weight="700">YES</tspan><tspan fill="#e8eef7">: within authority</tspan></text>
<text x="50" y="250" font-size="15"><tspan fill="#1a8f5e" font-weight="700">YES</tspan><tspan fill="#e8eef7">: real effect while</tspan></text>
<text x="50" y="270" font-size="15" fill="#e8eef7">     it runs</text>
<text x="150" y="306" font-size="15" fill="#e8eef7" fill-opacity="0.9" text-anchor="middle" font-style="italic">Ends when the</text>
<text x="150" y="326" font-size="15" fill="#e8eef7" fill-opacity="0.9" text-anchor="middle" font-style="italic">station stops.</text>

<rect x="280" y="100" width="240" height="380" rx="10" fill="#12161d" stroke="#e8eef7" stroke-width="2" />
<text x="400" y="132" font-size="18" fill="#e8eef7" text-anchor="middle" font-weight="700">Proposal B</text>
<text x="400" y="154" font-size="15" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">Fencing</text>
<text x="300" y="210" font-size="15"><tspan fill="#1a8f5e" font-weight="700">YES</tspan><tspan fill="#e8eef7">: within budget</tspan></text>
<text x="300" y="230" font-size="15"><tspan fill="#1a8f5e" font-weight="700">YES</tspan><tspan fill="#e8eef7">: ready in days</tspan></text>
<text x="300" y="250" font-size="15"><tspan fill="#e8eef7" font-weight="700">NO</tspan><tspan fill="#e8eef7">: starving chicks,</tspan></text>
<text x="300" y="270" font-size="15" fill="#e8eef7">    not predators</text>
<text x="400" y="306" font-size="15" fill="#e8eef7" fill-opacity="0.9" text-anchor="middle" font-style="italic">Fast and cheap,</text>
<text x="400" y="326" font-size="15" fill="#e8eef7" fill-opacity="0.9" text-anchor="middle" font-style="italic">wrong cause.</text>

<rect x="530" y="100" width="240" height="380" rx="10" fill="#12161d" stroke="#e8eef7" stroke-width="2" />
<text x="650" y="132" font-size="18" fill="#e8eef7" text-anchor="middle" font-weight="700">Proposal C</text>
<text x="650" y="154" font-size="15" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">Petition to delay</text>
<text x="650" y="174" font-size="15" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">the herring season</text>
<text x="550" y="210" font-size="15"><tspan fill="#1a8f5e" font-weight="700">YES</tspan><tspan fill="#e8eef7">: closes the</tspan></text>
<text x="550" y="230" font-size="15" fill="#e8eef7">     mismatch at its</text>
<text x="550" y="250" font-size="15" fill="#e8eef7">     root</text>
<text x="550" y="270" font-size="15"><tspan fill="#e8eef7" font-weight="700">NO</tspan><tspan fill="#e8eef7">: takes over 4</tspan></text>
<text x="550" y="290" font-size="15" fill="#e8eef7">    months, past one</text>
<text x="550" y="310" font-size="15" fill="#e8eef7">    season</text>
<text x="550" y="330" font-size="15"><tspan fill="#e8eef7" font-weight="700">NO</tspan><tspan fill="#e8eef7">: outside the</tspan></text>
<text x="550" y="350" font-size="15" fill="#e8eef7">    Network's own</text>
<text x="550" y="370" font-size="15" fill="#e8eef7">    authority</text>
<text x="650" y="406" font-size="15" fill="#e8eef7" fill-opacity="0.9" text-anchor="middle" font-style="italic">Right fix, wrong</text>
<text x="650" y="426" font-size="15" fill="#e8eef7" fill-opacity="0.9" text-anchor="middle" font-style="italic">timeline and reach.</text>
</svg>
