<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img">
<rect x="0" y="0" width="800" height="460" fill="#0f1218" />
<text x="400" y="30" font-size="22" fill="#e8eef7" text-anchor="middle" font-weight="700">Cold air meets warm air: how a front forms</text>

<line x1="40" y1="380" x2="760" y2="380" stroke="#e8eef7" stroke-width="2" />

<polygon points="40,380 460,380 140,270" fill="#17202b" stroke="#e8eef7" stroke-width="2" />

<line x1="140" y1="270" x2="460" y2="380" stroke="#1a8f5e" stroke-width="4" />
<text x="200" y="258" font-size="18" fill="#1a8f5e" font-weight="700">front</text>

<line x1="90" y1="360" x2="270" y2="360" stroke="#e8eef7" stroke-width="3" />
<polygon points="270,360 254,352 254,368" fill="#e8eef7" />
<text x="90" y="345" font-size="17" fill="#e8eef7">cold air slides in low</text>

<path d="M410,345 Q460,240 498,172" fill="none" stroke="#e8eef7" stroke-width="3" />
<polygon points="498,172 482,187 508,192" fill="#e8eef7" />
<text x="300" y="205" font-size="17" fill="#e8eef7">warm air forced upward</text>

<circle cx="515" cy="132" r="20" fill="#17202b" stroke="#e8eef7" stroke-width="2" />
<circle cx="545" cy="110" r="26" fill="#17202b" stroke="#e8eef7" stroke-width="2" />
<circle cx="573" cy="132" r="20" fill="#17202b" stroke="#e8eef7" stroke-width="2" />
<text x="485" y="125" font-size="17" fill="#e8eef7" text-anchor="end">moisture condenses into clouds</text>

<line x1="530" y1="178" x2="515" y2="228" stroke="#e8eef7" stroke-width="2" />
<line x1="555" y1="181" x2="540" y2="231" stroke="#e8eef7" stroke-width="2" />
<line x1="580" y1="181" x2="565" y2="231" stroke="#e8eef7" stroke-width="2" />
<line x1="605" y1="178" x2="590" y2="228" stroke="#e8eef7" stroke-width="2" />
<text x="600" y="252" font-size="17" fill="#e8eef7">rain</text>

<text x="400" y="412" font-size="17" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">Falling pressure, rising humidity, a wind shift, then falling</text>
<text x="400" y="434" font-size="17" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">temperature and rising wind speed can flag a front a full day early.</text>
</svg>
