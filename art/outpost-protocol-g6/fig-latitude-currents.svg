<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img">
<rect x="0" y="0" width="800" height="480" fill="#0f1218" />
<text x="400" y="30" font-size="22" fill="#e8eef7" text-anchor="middle" font-weight="700">Same latitude, different climate</text>

<line x1="40" y1="150" x2="760" y2="150" stroke="#e8eef7" stroke-width="2" stroke-dasharray="6 6" />
<text x="400" y="140" font-size="16" fill="#e8eef7" text-anchor="middle">same latitude, same sun angle all year</text>

<path d="M50,220 q20,-10 40,0 q20,10 40,0 q20,-10 40,0 q20,10 40,0" fill="none" stroke="#e8eef7" stroke-width="2" fill-opacity="0.6" />
<path d="M50,240 q20,-10 40,0 q20,10 40,0 q20,-10 40,0 q20,10 40,0" fill="none" stroke="#e8eef7" stroke-width="2" fill-opacity="0.6" />
<text x="150" y="195" font-size="17" fill="#e8eef7" text-anchor="middle">OCEAN</text>

<line x1="270" y1="170" x2="270" y2="260" stroke="#e8eef7" stroke-width="2" />
<text x="270" y="163" font-size="15" fill="#e8eef7" text-anchor="middle">coast</text>

<text x="530" y="255" font-size="16" fill="#e8eef7" text-anchor="middle">LAND: dry, continental air</text>

<circle cx="300" cy="210" r="8" fill="#1a8f5e" stroke="#e8eef7" stroke-width="2" />
<text x="300" y="190" font-size="18" fill="#e8eef7" text-anchor="middle" font-weight="700">Cairn Bay</text>
<text x="300" y="232" font-size="15" fill="#e8eef7" fill-opacity="0.8" text-anchor="middle">on the coast</text>

<circle cx="700" cy="210" r="8" fill="#e8eef7" stroke="#1a8f5e" stroke-width="2" />
<text x="700" y="190" font-size="18" fill="#e8eef7" text-anchor="middle" font-weight="700">Sable Flats</text>
<text x="700" y="232" font-size="15" fill="#e8eef7" fill-opacity="0.8" text-anchor="middle">well inland</text>

<path d="M330,180 Q345,220 330,258" fill="none" stroke="#1a8f5e" stroke-width="3" />
<polygon points="330,258 322,242 338,244" fill="#1a8f5e" />
<text x="345" y="200" font-size="15" fill="#1a8f5e" font-weight="700">current: keeps</text>
<text x="345" y="218" font-size="15" fill="#1a8f5e" font-weight="700">coastal water steady</text>

<polygon points="80,286 80,314 690,304 690,296" fill="rgba(232,238,247,0.22)" stroke="#e8eef7" stroke-width="1" />
<polygon points="690,290 690,310 745,300" fill="#e8eef7" />
<text x="90" y="278" font-size="16" fill="#e8eef7">wind belt: blows off the ocean</text>
<text x="550" y="332" font-size="15" fill="#e8eef7" text-anchor="middle">arrives far drier, drops its moisture along the way</text>

<rect x="60" y="380" width="320" height="70" rx="10" fill="none" stroke="#e8eef7" stroke-width="2" />
<text x="220" y="404" font-size="16" fill="#e8eef7" text-anchor="middle" font-weight="700">Cairn Bay: coast, current nearby</text>
<text x="220" y="426" font-size="15" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">so: smaller seasonal swing</text>

<rect x="420" y="380" width="320" height="70" rx="10" fill="none" stroke="#e8eef7" stroke-width="2" />
<text x="580" y="404" font-size="16" fill="#e8eef7" text-anchor="middle" font-weight="700">Sable Flats: inland, no current</text>
<text x="580" y="426" font-size="15" fill="#e8eef7" fill-opacity="0.85" text-anchor="middle">so: wider seasonal swing</text>
</svg>
