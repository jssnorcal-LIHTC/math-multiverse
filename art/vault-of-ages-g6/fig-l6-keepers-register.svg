<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">the register's own first entry</text>
<line x1="78" y1="88.5" x2="446.94" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">year</text>
<text x="176" y="126" font-size="22" fill="#e8eef7">the first year of the register</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">hidden by</text>
<text x="176" y="154" font-size="22" fill="#e8eef7">a lighthouse keeper's daughter</text>
<text x="78" y="182" font-size="20" fill="#e8eef7" fill-opacity="0.82">object</text>
<text x="176" y="182" font-size="22" fill="#e8eef7">a brass compass with a cracked face</text>
<line x1="78" y1="194.5" x2="722" y2="194.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="232" font-size="22" fill="#e8eef7">reason</text>
<text x="78" y="264" font-size="22" fill="#e8eef7">that her father steered by it for forty winters,</text>
<rect x="70" y="272" width="504.94" height="32" fill="none" stroke="#7c5cff" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="296" font-size="22" fill="#e8eef7">and that it should not be made to point anywhere else.</text>
<g transform="rotate(-12 590.47 84.08)">
<rect x="462.94" y="64.08" width="255.06" height="40" fill="none" stroke="rgba(232,238,247,0.65)" stroke-width="2" rx="4" data-stamp="1" />
<text x="590.47" y="92.08" font-size="22" fill="#7c5cff" text-anchor="middle">Nothing leaves the room.</text>
</g>
</svg>
