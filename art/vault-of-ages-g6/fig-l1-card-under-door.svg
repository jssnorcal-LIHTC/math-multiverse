<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">The card</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">at eleven at night</text>
<text x="370" y="126" font-size="22" fill="#e8eef7">under Theo Brack's door</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">plain white and unlined</text>
<text x="370" y="154" font-size="22" fill="#e8eef7">exactly six words</text>
<text x="78" y="182" font-size="20" fill="#e8eef7" fill-opacity="0.82">handwriting</text>
<text x="370" y="182" font-size="22" fill="#e8eef7">so neat it looks printed</text>
<line x1="78" y1="194.5" x2="722" y2="194.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="232" font-size="22" fill="#e8eef7">You noticed the gap.</text>
<text x="78" y="264" font-size="22" fill="#e8eef7">Come find out why.</text>
<text x="78" y="296" font-size="22" fill="#e8eef7">an address on the back:</text>
<text x="78" y="328" font-size="22" fill="#e8eef7">the old Bellhaven Athenaeum</text>
<text x="78" y="360" font-size="22" fill="#e8eef7">the library building three streets over</text>
</svg>
