<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">Two accounts of the Abydos seal chamber</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="138" font-size="22" fill="#e8eef7"><tspan x="78" dy="0"></tspan></text>
<text x="292.67" y="138" font-size="22" fill="#e8eef7"><tspan x="292.67" dy="0">temple chronicle</tspan></text>
<line x1="285.5" y1="110" x2="285.5" y2="328" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="507.33" y="138" font-size="22" fill="#e8eef7"><tspan x="507.33" dy="0">guild ledger</tspan></text>
<line x1="499.5" y1="110" x2="499.5" y2="328" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="150.5" x2="722" y2="150.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="174" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">claim</tspan></text>
<text x="292.67" y="174" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">never been entered</tspan></text>
<text x="507.33" y="174" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">the chamber</tspan> <tspan x="507.33" dy="22">was entered</tspan></text>
<line x1="78" y1="203.5" x2="722" y2="203.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="224" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">evidence</tspan></text>
<text x="292.67" y="224" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">a claim resting on faith</tspan></text>
<text x="507.33" y="224" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">two sets of tool marks</tspan></text>
<line x1="78" y1="231.5" x2="722" y2="231.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="252" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">check it</tspan></text>
<text x="292.67" y="252" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">unverifiable by its</tspan> <tspan x="292.67" dy="22">very nature</tspan></text>
<text x="507.33" y="252" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">in principle, verifiable</tspan></text>
<line x1="78" y1="281.5" x2="722" y2="281.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="302" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">weak point</tspan></text>
<text x="292.67" y="302" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">cannot check itself</tspan></text>
<text x="507.33" y="302" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">a guild's own</tspan> <tspan x="507.33" dy="22">private record</tspan></text>
</svg>
