<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">Three of those descriptions side by side</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">they agree</text>
<text x="214" y="126" font-size="22" fill="#e8eef7">a real place with real geography</text>
<line x1="78" y1="138.5" x2="722" y2="138.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="184" font-size="22" fill="#e8eef7"><tspan x="78" dy="0">three</tspan> <tspan x="78" dy="22">traditions</tspan></text>
<text x="239" y="184" font-size="22" fill="#e8eef7"><tspan x="239" dy="0">The Greek</tspan></text>
<line x1="231.5" y1="156" x2="231.5" y2="368" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="400" y="184" font-size="22" fill="#e8eef7"><tspan x="400" dy="0">The</tspan> <tspan x="400" dy="22">Egyptian</tspan></text>
<line x1="392.5" y1="156" x2="392.5" y2="368" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="561" y="184" font-size="22" fill="#e8eef7"><tspan x="561" dy="0">The Norse</tspan></text>
<line x1="553.5" y1="156" x2="553.5" y2="368" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="218.5" x2="722" y2="218.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="242" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">a place the</tspan> <tspan x="78" dy="22">dead go</tspan></text>
<text x="239" y="242" font-size="20" fill="#e8eef7"><tspan x="239" dy="0">a single</tspan> <tspan x="239" dy="22">kingdom</tspan></text>
<text x="400" y="242" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">a journey</tspan></text>
<text x="561" y="242" font-size="20" fill="#e8eef7"><tspan x="561" dy="0">a cold and</tspan> <tspan x="561" dy="22">misty realm</tspan></text>
<line x1="78" y1="265.5" x2="722" y2="265.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="292" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the dead</tspan></text>
<text x="239" y="292" font-size="20" fill="#e8eef7"><tspan x="239" dy="0">drift as</tspan> <tspan x="239" dy="22">shades</tspan></text>
<text x="400" y="292" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">weighed on a</tspan> <tspan x="400" dy="22">scale</tspan></text>
<text x="561" y="292" font-size="20" fill="#e8eef7"><tspan x="561" dy="0">simply</tspan> <tspan x="561" dy="22">continue</tspan></text>
<line x1="78" y1="315.5" x2="722" y2="315.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="342" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">a ruler</tspan></text>
<text x="239" y="342" font-size="20" fill="#e8eef7"><tspan x="239" dy="0">The kingdom</tspan> <tspan x="239" dy="22">has a ruler</tspan></text>
<text x="561" y="342" font-size="20" fill="#e8eef7"><tspan x="561" dy="0">ruled by a</tspan> <tspan x="561" dy="22">figure</tspan></text>
</svg>
