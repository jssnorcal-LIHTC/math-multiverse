<text x="584" y="182" font-size="18" fill="#e8eef7" text-anchor="middle" fill-opacity="0.82"><tspan x="584" dy="0">The loan paperwork to past the</tspan> <tspan x="584" dy="22">loan date, no theft report</tspan></text>
<text x="62" y="236" font-size="18" fill="#7c5cff" text-anchor="end">1.</text>
<text x="70" y="236" font-size="20" fill="#e8eef7" fill-opacity="0.82">a coastal site</text>
<text x="300" y="236" font-size="22" fill="#e8eef7">A university excavation recovered</text>
<text x="62" y="262" font-size="18" fill="#7c5cff" text-anchor="end">2.</text>
<text x="70" y="262" font-size="20" fill="#e8eef7" fill-opacity="0.82">over thirty years</text>
<text x="300" y="262" font-size="22" fill="#e8eef7">logged into a teaching collection</text>
<text x="62" y="288" font-size="18" fill="#7c5cff" text-anchor="end">3.</text>
<text x="70" y="288" font-size="20" fill="#e8eef7" fill-opacity="0.82">eight years ago</text>
<text x="300" y="288" font-size="22" fill="#e8eef7">A visiting researcher requested it</text>
<text x="62" y="314" font-size="18" fill="#7c5cff" text-anchor="end">4.</text>
<text x="70" y="314" font-size="20" fill="#e8eef7" fill-opacity="0.82">The loan paperwork</text>
<text x="300" y="314" font-size="22" fill="#e8eef7">was completed and filed correctly</text>
<text x="62" y="340" font-size="18" fill="#7c5cff" text-anchor="end">5.</text>
<text x="70" y="340" font-size="20" fill="#e8eef7" fill-opacity="0.82">The stone itself</text>
<text x="300" y="340" font-size="22" fill="#e8eef7">was never returned</text>
<text x="62" y="366" font-size="18" fill="#7c5cff" text-anchor="end">6.</text>
<text x="70" y="366" font-size="20" fill="#e8eef7" fill-opacity="0.82">The researcher's</text>
<text x="300" y="366" font-size="22" fill="#e8eef7">listed institution has no record</text>
<text x="62" y="392" font-size="18" fill="#7c5cff" text-anchor="end">7.</text>
<text x="70" y="392" font-size="20" fill="#e8eef7" fill-opacity="0.82">past the loan date</text>
<text x="300" y="392" font-size="22" fill="#e8eef7" data-kind="unverified">No verified sighting exists</text>
