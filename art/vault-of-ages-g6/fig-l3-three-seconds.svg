<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">the missing three seconds</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="130" font-size="20" fill="#e8eef7">leaves out the one moment that might matter most:</text>
<text x="78" y="162" font-size="22" fill="#e8eef7">a flicker of recognition on Kade's face</text>
<text x="78" y="202" font-size="22" fill="#e8eef7"><tspan x="78" dy="0">Dash's log</tspan></text>
<text x="400" y="202" font-size="22" fill="#e8eef7"><tspan x="400" dy="0">Theo's log</tspan></text>
<line x1="392.5" y1="174" x2="392.5" y2="364" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="214.5" x2="722" y2="214.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="238" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the door was empty both</tspan> <tspan x="78" dy="22">before and after</tspan></text>
<text x="400" y="238" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">delivered a cover story</tspan> <tspan x="400" dy="22">about a framing order</tspan></text>
<line x1="78" y1="261.5" x2="722" y2="261.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="288" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">nothing could be</tspan> <tspan x="78" dy="22">confirmed</tspan></text>
<text x="400" y="288" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">left without incident</tspan></text>
<line x1="78" y1="311.5" x2="722" y2="311.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="338" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">Dash wrote down the gap.</tspan></text>
<text x="400" y="338" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">not important enough to</tspan> <tspan x="400" dy="22">write down</tspan></text>
</svg>
