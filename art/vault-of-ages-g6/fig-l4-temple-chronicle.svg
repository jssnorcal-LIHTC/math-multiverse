<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">a translation of an inscription</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">carved into</text>
<text x="262" y="126" font-size="22" fill="#e8eef7">a temple chamber at Abydos</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">Temple scribes</text>
<text x="262" y="154" font-size="22" fill="#e8eef7">wrote to honor the priesthood</text>
<text x="78" y="182" font-size="20" fill="#e8eef7" fill-opacity="0.82">carries</text>
<text x="262" y="182" font-size="22" fill="#e8eef7">no author's name</text>
<line x1="78" y1="194.5" x2="722" y2="194.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="232" font-size="22" fill="#e8eef7">The seal remains in this chamber to this day.</text>
<text x="78" y="264" font-size="22" fill="#e8eef7">No enemy of the temple has ever set foot</text>
<text x="78" y="296" font-size="22" fill="#e8eef7">in this chamber.</text>
<rect x="70" y="304" width="464.8" height="32" fill="none" stroke="#7c5cff" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="332" font-size="22" fill="#e8eef7">It is a fact requiring only faith.</text>
</svg>
