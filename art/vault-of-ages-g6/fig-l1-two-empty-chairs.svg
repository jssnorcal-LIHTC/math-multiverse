<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<text x="40" y="44" font-size="26" fill="#e8eef7">four chairs around Finch's table</text>
<g data-layout="plan"></g>
<line x1="233.61" y1="127.99" x2="366.39" y2="220.57" stroke="rgba(232,238,247,0.5)" stroke-width="2" />
<line x1="556.22" y1="128.13" x2="431.78" y2="220.43" stroke="rgba(232,238,247,0.5)" stroke-width="2" />
<line x1="604.47" y1="360.47" x2="440.33" y2="266.97" stroke="rgba(232,238,247,0.5)" stroke-width="2" />
<line x1="257.27" y1="342.59" x2="366.11" y2="267.41" stroke="rgba(232,238,247,0.5)" stroke-width="2" />
<rect x="40" y="84.56" width="320" height="40" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.5)" stroke-width="2" rx="4" data-shape="box" />
<text x="200" y="111.56" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="200" dy="0">the one nearest the door</tspan></text>
<rect x="416" y="84.56" width="344" height="40" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.5)" stroke-width="2" rx="4" data-shape="box" />
<text x="588" y="111.56" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="588" dy="0">introduces himself as Theo</tspan></text>
<rect x="306" y="224" width="188" height="40" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.5)" stroke-width="2" rx="4" data-shape="box" />
<text x="400" y="251" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="400" dy="0">Finch's table</tspan></text>
<rect x="532.8" y="363.44" width="224" height="40" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.5)" stroke-width="2" rx="4" data-shape="box" />
<text x="644.8" y="390.44" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="644.8" dy="0">his name is Dash</tspan></text>
<rect x="40" y="346" width="332" height="64" fill="rgba(232,238,247,0.06)" stroke="#7c5cff" stroke-width="2" rx="32" data-shape="round" />
<text x="206" y="373" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="206" dy="0">the fourth chair is still</tspan> <tspan x="206" dy="24">empty</tspan></text>
</svg>
