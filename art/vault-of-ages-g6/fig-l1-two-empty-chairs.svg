<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<text x="40" y="44" font-size="26" fill="#e8eef7">four chairs around Finch's table</text>
<g data-layout="plan"></g>
<line x1="195.53" y1="127.53" x2="359.67" y2="221.03" stroke="rgba(232,238,247,0.5)" stroke-width="2" />
<line x1="594.01" y1="127.65" x2="438.49" y2="220.91" stroke="rgba(232,238,247,0.5)" stroke-width="2" />
<line x1="604.47" y1="360.47" x2="440.33" y2="266.97" stroke="rgba(232,238,247,0.5)" stroke-width="2" />
<line x1="212.8" y1="360.27" x2="362.7" y2="267.17" stroke="rgba(232,238,247,0.5)" stroke-width="2" />
<rect x="40.7" y="84.56" width="229" height="40" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.5)" stroke-width="2" rx="4" data-shape="box" />
<text x="155.2" y="111.56" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="155.2" dy="0">the one nearest the door</tspan></text>
<rect x="505" y="84.56" width="255" height="40" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.5)" stroke-width="2" rx="4" data-shape="box" />
<text x="632.5" y="111.56" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="632.5" dy="0">introduces himself as Theo</tspan></text>
<rect x="332" y="224" width="136" height="40" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.5)" stroke-width="2" rx="4" data-shape="box" />
<text x="400" y="251" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="400" dy="0">Finch's table</tspan></text>
<rect x="558.3" y="363.44" width="173" height="40" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.5)" stroke-width="2" rx="4" data-shape="box" />
<text x="644.8" y="390.44" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="644.8" dy="0">his name is Dash</tspan></text>
<rect x="40" y="363.44" width="271" height="40" fill="rgba(232,238,247,0.06)" stroke="#7c5cff" stroke-width="2" rx="20" data-shape="round" />
<text x="175.5" y="390.44" font-size="20" fill="#e8eef7" text-anchor="middle"><tspan x="175.5" dy="0">the fourth chair is still empty</tspan></text>
</svg>
