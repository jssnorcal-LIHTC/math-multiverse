<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<text x="40" y="44" font-size="26" fill="#e8eef7">the longest forty minutes of my life</text>
<text x="760" y="70" font-size="18" fill="#e8eef7" text-anchor="end" fill-opacity="0.62">in order, not to scale</text>
<rect x="297.67" y="108" width="220.67" height="48" fill="none" stroke="rgba(232,238,247,0.35)" stroke-width="1" data-gap="the two minutes I could not see" />
