<line x1="466.67" y1="108" x2="418.67" y2="156" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="488.67" y1="108" x2="440.67" y2="156" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="510.67" y1="108" x2="462.67" y2="156" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="525.33" y1="115.33" x2="484.67" y2="156" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="525.33" y1="137.33" x2="506.67" y2="156" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="56" y1="128.5" x2="760" y2="128.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" stroke-dasharray="7 6" />
<circle cx="56" cy="128" r="7" fill="#7c5cff" />
<text x="56" y="114" font-size="18" fill="#7c5cff" text-anchor="middle">1</text>
<circle cx="290.67" cy="128" r="7" fill="#7c5cff" />
<text x="290.67" y="114" font-size="18" fill="#7c5cff" text-anchor="middle">2</text>
<circle cx="525.33" cy="128" r="7" fill="#7c5cff" />
<text x="525.33" y="114" font-size="18" fill="#7c5cff" text-anchor="middle">3</text>
<circle cx="760" cy="128" r="7" fill="#7c5cff" />
<text x="760" y="114" font-size="18" fill="#7c5cff" text-anchor="middle">4</text>
<text x="408" y="182" font-size="18" fill="#e8eef7" text-anchor="middle" fill-opacity="0.82">eleven-eleven to eleven-thirteen, the two minutes I could not see</text>
<text x="62" y="214" font-size="18" fill="#7c5cff" text-anchor="end">1.</text>
<text x="70" y="214" font-size="20" fill="#e8eef7" fill-opacity="0.82">eleven on the dot</text>
<text x="288" y="214" font-size="22" fill="#e8eef7">Theo went in</text>
<text x="62" y="240" font-size="18" fill="#7c5cff" text-anchor="end">2.</text>
<text x="70" y="240" font-size="20" fill="#e8eef7" fill-opacity="0.82">eleven-eleven</text>
<text x="288" y="240" font-size="22" fill="#e8eef7">a delivery van double-parks</text>
<text x="62" y="266" font-size="18" fill="#7c5cff" text-anchor="end">3.</text>
<text x="70" y="266" font-size="20" fill="#e8eef7" fill-opacity="0.82">eleven-thirteen</text>
<text x="288" y="266" font-size="22" fill="#e8eef7">The van pulls away</text>
<text x="62" y="292" font-size="18" fill="#7c5cff" text-anchor="end">4.</text>
<text x="70" y="292" font-size="20" fill="#e8eef7" fill-opacity="0.82">eleven-fourteen</text>
<text x="288" y="292" font-size="22" fill="#e8eef7">the revolving door spits Theo out</text>
</svg>
