<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<text x="40" y="44" font-size="26" fill="#e8eef7">the plan's own clock</text>
<text x="760" y="44" font-size="18" fill="#e8eef7" text-anchor="end" fill-opacity="0.62">in order, not to scale</text>
<rect x="359.8" y="108" width="189.6" height="94" fill="none" stroke="rgba(232,238,247,0.35)" stroke-width="1" data-gap="blocking most of my view" />
<line x1="381.8" y1="108" x2="359.8" y2="130" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="403.8" y1="108" x2="359.8" y2="152" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="425.8" y1="108" x2="359.8" y2="174" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="447.8" y1="108" x2="359.8" y2="196" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="469.8" y1="108" x2="375.8" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="491.8" y1="108" x2="397.8" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="513.8" y1="108" x2="419.8" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="535.8" y1="108" x2="441.8" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="549.4" y1="116.4" x2="463.8" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="549.4" y1="138.4" x2="485.8" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="549.4" y1="160.4" x2="507.8" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="549.4" y1="182.4" x2="529.8" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<text x="40" y="134" font-size="18" fill="#e8eef7" fill-opacity="0.82">the time the plan expected</text>
<line x1="251" y1="128.5" x2="760" y2="128.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" stroke-dasharray="7 6" />
<text x="40" y="180" font-size="18" fill="#e8eef7" fill-opacity="0.82">the real time</text>
<line x1="251" y1="174.5" x2="760" y2="174.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" stroke-dasharray="7 6" />
<circle cx="251" cy="174" r="7" fill="#7c5cff" />
<text x="251" y="196" font-size="18" fill="#7c5cff" text-anchor="middle">1</text>
<circle cx="352.8" cy="174" r="7" fill="#7c5cff" />
<text x="352.8" y="196" font-size="18" fill="#7c5cff" text-anchor="middle">2</text>
<circle cx="454.6" cy="128" r="7" fill="#7c5cff" />
<text x="454.6" y="114" font-size="18" fill="#7c5cff" text-anchor="middle">3</text>
<circle cx="556.4" cy="174" r="7" fill="#7c5cff" />
<text x="556.4" y="196" font-size="18" fill="#7c5cff" text-anchor="middle">4</text>
<circle cx="658.2" cy="174" r="7" fill="#7c5cff" />
<text x="658.2" y="196" font-size="18" fill="#7c5cff" text-anchor="middle">5</text>
<circle cx="760" cy="128" r="7" fill="#7c5cff" />
<text x="760" y="114" font-size="18" fill="#7c5cff" text-anchor="middle">6</text>
<text x="454.6" y="228" font-size="18" fill="#e8eef7" text-anchor="middle" fill-opacity="0.82">two-nineteen to two-twenty-two, blocking most of my view</text>
<text x="62" y="260" font-size="18" fill="#7c5cff" text-anchor="end">1.</text>
<text x="70" y="260" font-size="20" fill="#e8eef7" fill-opacity="0.82">two</text>
<text x="220" y="260" font-size="22" fill="#e8eef7">Mila went in at two</text>
<text x="62" y="286" font-size="18" fill="#7c5cff" text-anchor="end">2.</text>
<text x="70" y="286" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-nineteen</text>
<text x="220" y="286" font-size="22" fill="#e8eef7">a service van pulls up</text>
<text x="62" y="312" font-size="18" fill="#7c5cff" text-anchor="end">3.</text>
<text x="70" y="312" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-twenty</text>
<text x="220" y="312" font-size="22" fill="#e8eef7">she checks in by two-twenty</text>
<text x="62" y="338" font-size="18" fill="#7c5cff" text-anchor="end">4.</text>
<text x="70" y="338" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-twenty-two</text>
<text x="220" y="338" font-size="22" fill="#e8eef7">The van pulls away at two-twenty-two</text>
<text x="62" y="364" font-size="18" fill="#7c5cff" text-anchor="end">5.</text>
<text x="70" y="364" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-twenty-four</text>
<text x="220" y="364" font-size="22" fill="#e8eef7">the radio clicks twice</text>
<text x="62" y="390" font-size="18" fill="#7c5cff" text-anchor="end">6.</text>
<text x="70" y="390" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-twenty-five</text>
<text x="220" y="390" font-size="22" fill="#e8eef7">the plan says I call Finch</text>
</svg>
