<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<text x="40" y="44" font-size="26" fill="#e8eef7">the plan's own clock</text>
<text x="760" y="44" font-size="18" fill="#e8eef7" text-anchor="end" fill-opacity="0.62">in order, not to scale</text>
<rect x="428.6" y="108" width="155.2" height="94" fill="none" stroke="rgba(232,238,247,0.35)" stroke-width="1" data-gap="blocking most of my view" />
<line x1="450.6" y1="108" x2="428.6" y2="130" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="472.6" y1="108" x2="428.6" y2="152" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="494.6" y1="108" x2="428.6" y2="174" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="516.6" y1="108" x2="428.6" y2="196" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="538.6" y1="108" x2="444.6" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="560.6" y1="108" x2="466.6" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="582.6" y1="108" x2="488.6" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="583.8" y1="128.8" x2="510.6" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="583.8" y1="150.8" x2="532.6" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="583.8" y1="172.8" x2="554.6" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<line x1="583.8" y1="194.8" x2="576.6" y2="202" stroke="rgba(232,238,247,0.35)" stroke-width="1" />
<text x="40" y="134" font-size="18" fill="#e8eef7" fill-opacity="0.82">the time the plan expected</text>
<line x1="337" y1="128.5" x2="760" y2="128.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" stroke-dasharray="7 6" />
<text x="40" y="180" font-size="18" fill="#e8eef7" fill-opacity="0.82">the real time</text>
<line x1="337" y1="174.5" x2="760" y2="174.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" stroke-dasharray="7 6" />
<circle cx="337" cy="174" r="7" fill="#7c5cff" />
<text x="337" y="196" font-size="18" fill="#7c5cff" text-anchor="middle">1</text>
<circle cx="421.6" cy="174" r="7" fill="#7c5cff" />
<text x="421.6" y="196" font-size="18" fill="#7c5cff" text-anchor="middle">2</text>
<circle cx="506.2" cy="128" r="7" fill="#7c5cff" />
<text x="506.2" y="114" font-size="18" fill="#7c5cff" text-anchor="middle">3</text>
<circle cx="590.8" cy="174" r="7" fill="#7c5cff" />
<text x="590.8" y="196" font-size="18" fill="#7c5cff" text-anchor="middle">4</text>
<circle cx="675.4" cy="174" r="7" fill="#7c5cff" />
<text x="675.4" y="196" font-size="18" fill="#7c5cff" text-anchor="middle">5</text>
<circle cx="760" cy="128" r="7" fill="#7c5cff" />
<text x="760" y="114" font-size="18" fill="#7c5cff" text-anchor="middle">6</text>
<text x="506.2" y="228" font-size="18" fill="#e8eef7" text-anchor="middle" fill-opacity="0.82"><tspan x="506.2" dy="0">two-nineteen to two-twenty-two, blocking most</tspan> <tspan x="506.2" dy="22">of my view</tspan></text>
<text x="62" y="282" font-size="18" fill="#7c5cff" text-anchor="end">1.</text>
<text x="70" y="282" font-size="20" fill="#e8eef7" fill-opacity="0.82">two</text>
<text x="264" y="282" font-size="22" fill="#e8eef7">Mila went in at two</text>
<text x="62" y="306" font-size="18" fill="#7c5cff" text-anchor="end">2.</text>
<text x="70" y="306" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-nineteen</text>
<text x="264" y="306" font-size="22" fill="#e8eef7">a service van pulls up</text>
<text x="62" y="330" font-size="18" fill="#7c5cff" text-anchor="end">3.</text>
<text x="70" y="330" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-twenty</text>
<text x="264" y="330" font-size="22" fill="#e8eef7">she checks in by two-twenty</text>
<text x="62" y="354" font-size="18" fill="#7c5cff" text-anchor="end">4.</text>
<text x="70" y="354" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-twenty-two</text>
<text x="264" y="354" font-size="22" fill="#e8eef7">The van pulls away at two-twenty-two</text>
<text x="62" y="378" font-size="18" fill="#7c5cff" text-anchor="end">5.</text>
<text x="70" y="378" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-twenty-four</text>
<text x="264" y="378" font-size="22" fill="#e8eef7">the radio clicks twice</text>
<text x="62" y="402" font-size="18" fill="#7c5cff" text-anchor="end">6.</text>
<text x="70" y="402" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-twenty-five</text>
<text x="264" y="402" font-size="22" fill="#e8eef7">the plan says I call Finch</text>
</svg>
