<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">three accounts of the night noise</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">Three people</text>
<text x="238" y="126" font-size="22" fill="#e8eef7">after closing on Wednesday evening</text>
<line x1="78" y1="138.5" x2="722" y2="138.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<rect x="70" y="156" width="580" height="32" fill="none" stroke="#b45309" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="176" font-size="20" fill="#e8eef7">None of the three witnesses saw anything at all</text>
<text x="78" y="216" font-size="22" fill="#e8eef7"><tspan x="78" dy="0">Cleo Fontaine</tspan></text>
<text x="292.67" y="216" font-size="22" fill="#e8eef7"><tspan x="292.67" dy="0">Wes Tanaka</tspan></text>
<line x1="285.5" y1="188" x2="285.5" y2="384" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="507.33" y="216" font-size="22" fill="#e8eef7"><tspan x="507.33" dy="0">Ruth</tspan> <tspan x="507.33" dy="22">Bellweather</tspan></text>
<line x1="499.5" y1="188" x2="499.5" y2="384" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="250.5" x2="722" y2="250.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="274" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">after eight</tspan></text>
<text x="292.67" y="274" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">closer to nine</tspan></text>
<text x="507.33" y="274" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">after dark</tspan></text>
<line x1="78" y1="275.5" x2="722" y2="275.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="302" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the parking lot</tspan></text>
<text x="292.67" y="302" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">from the marsh</tspan></text>
<text x="507.33" y="302" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">the marsh</tspan></text>
<line x1="78" y1="303.5" x2="722" y2="303.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="330" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">a roar</tspan></text>
<text x="292.67" y="330" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">low rather than</tspan> <tspan x="292.67" dy="22">loud</tspan></text>
<text x="507.33" y="330" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">like an old pump</tspan> <tspan x="507.33" dy="22">handle</tspan></text>
<line x1="78" y1="353.5" x2="722" y2="353.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="380" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">a full day later</tspan></text>
<text x="292.67" y="380" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">the same night</tspan></text>
<text x="507.33" y="380" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">Thursday morning</tspan></text>
</svg>
