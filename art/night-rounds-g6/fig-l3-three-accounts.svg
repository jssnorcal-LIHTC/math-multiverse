<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">three accounts of the night noise</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<rect x="70" y="106" width="442.63" height="32" fill="none" stroke="#b45309" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="134" font-size="22" fill="#e8eef7">None of the three witnesses saw anything at all</text>
<text x="191.53" y="174" font-size="22" fill="#e8eef7"><tspan x="191.53" dy="0">Fontaine</tspan></text>
<text x="368.36" y="174" font-size="22" fill="#e8eef7"><tspan x="368.36" dy="0">Tanaka</tspan></text>
<line x1="360.5" y1="146" x2="360.5" y2="320" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="545.18" y="174" font-size="22" fill="#e8eef7"><tspan x="545.18" dy="0">Bellweather</tspan></text>
<line x1="537.5" y1="146" x2="537.5" y2="320" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="186.5" x2="722" y2="186.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="210" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">the time</tspan></text>
<text x="191.53" y="210" font-size="20" fill="#e8eef7"><tspan x="191.53" dy="0">after eight</tspan></text>
<text x="368.36" y="210" font-size="20" fill="#e8eef7"><tspan x="368.36" dy="0">closer to nine</tspan></text>
<text x="545.18" y="210" font-size="20" fill="#e8eef7"><tspan x="545.18" dy="0">after dark</tspan></text>
<line x1="78" y1="217.5" x2="722" y2="217.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="238" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">came from</tspan></text>
<text x="191.53" y="238" font-size="20" fill="#e8eef7"><tspan x="191.53" dy="0">the parking lot</tspan></text>
<text x="368.36" y="238" font-size="20" fill="#e8eef7"><tspan x="368.36" dy="0">from the marsh</tspan></text>
<text x="545.18" y="238" font-size="20" fill="#e8eef7"><tspan x="545.18" dy="0">the marsh</tspan></text>
<line x1="78" y1="245.5" x2="722" y2="245.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="266" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">the sound</tspan></text>
<text x="191.53" y="266" font-size="20" fill="#e8eef7"><tspan x="191.53" dy="0">a roar</tspan></text>
<text x="368.36" y="266" font-size="20" fill="#e8eef7"><tspan x="368.36" dy="0">low rather</tspan> <tspan x="368.36" dy="22">than loud</tspan></text>
<text x="545.18" y="266" font-size="20" fill="#e8eef7"><tspan x="545.18" dy="0">like an old</tspan> <tspan x="545.18" dy="22">pump handle</tspan></text>
<line x1="78" y1="295.5" x2="722" y2="295.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="316" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">when given</tspan></text>
<text x="191.53" y="316" font-size="20" fill="#e8eef7"><tspan x="191.53" dy="0">a full day later</tspan></text>
<text x="368.36" y="316" font-size="20" fill="#e8eef7"><tspan x="368.36" dy="0">the same night</tspan></text>
<text x="545.18" y="316" font-size="20" fill="#e8eef7"><tspan x="545.18" dy="0">Thursday morning</tspan></text>
</svg>
