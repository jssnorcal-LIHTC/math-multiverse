<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">three accounts of the night noise</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<rect x="70" y="108" width="580" height="30" fill="none" stroke="#b45309" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="134" font-size="20" fill="#e8eef7">None of the three witnesses saw anything at all</text>
<text x="216" y="174" font-size="22" fill="#e8eef7"><tspan x="216" dy="0">Fontaine</tspan></text>
<text x="384.67" y="174" font-size="22" fill="#e8eef7"><tspan x="384.67" dy="0">Tanaka</tspan></text>
<line x1="377.5" y1="146" x2="377.5" y2="386" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="553.33" y="174" font-size="22" fill="#e8eef7"><tspan x="553.33" dy="0">Bellweather</tspan></text>
<line x1="545.5" y1="146" x2="545.5" y2="386" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="186.5" x2="722" y2="186.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="210" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">the time</tspan></text>
<text x="216" y="210" font-size="20" fill="#e8eef7"><tspan x="216" dy="0">after eight</tspan></text>
<text x="384.67" y="210" font-size="20" fill="#e8eef7"><tspan x="384.67" dy="0">closer to</tspan> <tspan x="384.67" dy="22">nine</tspan></text>
<text x="553.33" y="210" font-size="20" fill="#e8eef7"><tspan x="553.33" dy="0">after dark</tspan></text>
<line x1="78" y1="233.5" x2="722" y2="233.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="260" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">came from</tspan></text>
<text x="216" y="260" font-size="20" fill="#e8eef7"><tspan x="216" dy="0">the parking</tspan> <tspan x="216" dy="22">lot</tspan></text>
<text x="384.67" y="260" font-size="20" fill="#e8eef7"><tspan x="384.67" dy="0">from the</tspan> <tspan x="384.67" dy="22">marsh</tspan></text>
<text x="553.33" y="260" font-size="20" fill="#e8eef7"><tspan x="553.33" dy="0">the marsh</tspan></text>
<line x1="78" y1="283.5" x2="722" y2="283.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="310" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">the sound</tspan></text>
<text x="216" y="310" font-size="20" fill="#e8eef7"><tspan x="216" dy="0">a roar</tspan></text>
<text x="384.67" y="310" font-size="20" fill="#e8eef7"><tspan x="384.67" dy="0">low rather</tspan> <tspan x="384.67" dy="22">than loud</tspan></text>
<text x="553.33" y="310" font-size="20" fill="#e8eef7"><tspan x="553.33" dy="0">like an old</tspan> <tspan x="553.33" dy="22">pump handle</tspan></text>
<line x1="78" y1="333.5" x2="722" y2="333.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="360" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">when given</tspan></text>
<text x="216" y="360" font-size="20" fill="#e8eef7"><tspan x="216" dy="0">a full day</tspan> <tspan x="216" dy="22">later</tspan></text>
<text x="384.67" y="360" font-size="20" fill="#e8eef7"><tspan x="384.67" dy="0">the same</tspan> <tspan x="384.67" dy="22">night</tspan></text>
<text x="553.33" y="360" font-size="20" fill="#e8eef7"><tspan x="553.33" dy="0">Thursday</tspan> <tspan x="553.33" dy="22">morning</tspan></text>
</svg>
