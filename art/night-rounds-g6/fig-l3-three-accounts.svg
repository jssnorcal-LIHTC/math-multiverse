<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">three accounts of the night noise</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<rect x="70" y="110" width="580" height="32" fill="none" stroke="#b45309" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="130" font-size="20" fill="#e8eef7">None of the three witnesses saw anything at all</text>
<text x="216" y="170" font-size="22" fill="#e8eef7"><tspan x="216" dy="0">Fontaine</tspan></text>
<text x="384.67" y="170" font-size="22" fill="#e8eef7"><tspan x="384.67" dy="0">Tanaka</tspan></text>
<line x1="377.5" y1="142" x2="377.5" y2="382" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="553.33" y="170" font-size="22" fill="#e8eef7"><tspan x="553.33" dy="0">Bellweather</tspan></text>
<line x1="545.5" y1="142" x2="545.5" y2="382" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="182.5" x2="722" y2="182.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="206" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">the time</tspan></text>
<text x="216" y="206" font-size="20" fill="#e8eef7"><tspan x="216" dy="0">after eight</tspan></text>
<text x="384.67" y="206" font-size="20" fill="#e8eef7"><tspan x="384.67" dy="0">closer to</tspan> <tspan x="384.67" dy="22">nine</tspan></text>
<text x="553.33" y="206" font-size="20" fill="#e8eef7"><tspan x="553.33" dy="0">after dark</tspan></text>
<line x1="78" y1="229.5" x2="722" y2="229.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="256" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">came from</tspan></text>
<text x="216" y="256" font-size="20" fill="#e8eef7"><tspan x="216" dy="0">the parking</tspan> <tspan x="216" dy="22">lot</tspan></text>
<text x="384.67" y="256" font-size="20" fill="#e8eef7"><tspan x="384.67" dy="0">from the</tspan> <tspan x="384.67" dy="22">marsh</tspan></text>
<text x="553.33" y="256" font-size="20" fill="#e8eef7"><tspan x="553.33" dy="0">the marsh</tspan></text>
<line x1="78" y1="279.5" x2="722" y2="279.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="306" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">the sound</tspan></text>
<text x="216" y="306" font-size="20" fill="#e8eef7"><tspan x="216" dy="0">a roar</tspan></text>
<text x="384.67" y="306" font-size="20" fill="#e8eef7"><tspan x="384.67" dy="0">low rather</tspan> <tspan x="384.67" dy="22">than loud</tspan></text>
<text x="553.33" y="306" font-size="20" fill="#e8eef7"><tspan x="553.33" dy="0">like an old</tspan> <tspan x="553.33" dy="22">pump handle</tspan></text>
<line x1="78" y1="329.5" x2="722" y2="329.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="356" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">when given</tspan></text>
<text x="216" y="356" font-size="20" fill="#e8eef7"><tspan x="216" dy="0">a full day</tspan> <tspan x="216" dy="22">later</tspan></text>
<text x="384.67" y="356" font-size="20" fill="#e8eef7"><tspan x="384.67" dy="0">the same</tspan> <tspan x="384.67" dy="22">night</tspan></text>
<text x="553.33" y="356" font-size="20" fill="#e8eef7"><tspan x="553.33" dy="0">Thursday</tspan> <tspan x="553.33" dy="22">morning</tspan></text>
</svg>
