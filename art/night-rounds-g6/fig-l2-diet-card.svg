<text x="78" y="78" font-size="20" fill="#e8eef7" fill-opacity="0.82">RANA</text>
<text x="274" y="78" font-size="22" fill="#e8eef7">river otter, enclosure four</text>
<text x="78" y="106" font-size="20" fill="#e8eef7" fill-opacity="0.82">two feeds daily</text>
<text x="274" y="106" font-size="22" fill="#e8eef7">7:00 and 15:30</text>
