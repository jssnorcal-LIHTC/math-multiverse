<text x="78" y="156" font-size="22" fill="#e8eef7">four hundred grams of capelin</text>
<text x="78" y="188" font-size="22" fill="#e8eef7">three hundred grams of herring</text>
<text x="78" y="220" font-size="22" fill="#e8eef7">two hundred grams of whole rainbow trout</text>
