<text x="78" y="284" font-size="20" fill="#e8eef7">crushed into the first feed, daily, no exceptions</text>
<text x="78" y="324" font-size="22" fill="#e8eef7"><tspan x="78" dy="0">Fourteen days</tspan></text>
<text x="292.67" y="324" font-size="22" fill="#e8eef7"><tspan x="292.67" dy="0">fish squares</tspan></text>
<line x1="285.5" y1="296" x2="285.5" y2="386" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="507.33" y="324" font-size="22" fill="#e8eef7"><tspan x="507.33" dy="0">supplement</tspan> <tspan x="507.33" dy="22">column</tspan></text>
<line x1="499.5" y1="296" x2="499.5" y2="386" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="358.5" x2="722" y2="358.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="382" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">of feeding</tspan></text>
<text x="292.67" y="382" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">twenty-eight</tspan></text>
