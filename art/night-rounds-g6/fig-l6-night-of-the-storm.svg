<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<text x="40" y="44" font-size="26" fill="#e8eef7">The night of the twenty-sixth of May</text>
<text x="121" y="74" font-size="20" fill="#e8eef7" fill-opacity="0.82">four o'clock</text>
<text x="760" y="74" font-size="20" fill="#e8eef7" text-anchor="end" fill-opacity="0.82">10:56 p.m.</text>
<text x="40" y="134" font-size="18" fill="#e8eef7" fill-opacity="0.82">record</text>
<line x1="121" y1="128.5" x2="760" y2="128.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<circle cx="121" cy="128" r="7" fill="#b45309" />
<text x="121" y="114" font-size="18" fill="#b45309" text-anchor="middle">1</text>
<circle cx="179.09" cy="128" r="7" fill="#b45309" />
<text x="179.09" y="114" font-size="18" fill="#b45309" text-anchor="middle">2</text>
<circle cx="237.18" cy="128" r="7" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3" data-kind="unverified" />
<text x="237.18" y="114" font-size="18" fill="#b45309" text-anchor="middle">3?</text>
<circle cx="295.27" cy="128" r="7" fill="#b45309" />
<text x="295.27" y="114" font-size="18" fill="#b45309" text-anchor="middle">4</text>
<circle cx="353.36" cy="128" r="7" fill="#b45309" />
<text x="353.36" y="114" font-size="18" fill="#b45309" text-anchor="middle">5</text>
<circle cx="411.45" cy="128" r="7" fill="#b45309" />
<text x="411.45" y="114" font-size="18" fill="#b45309" text-anchor="middle">6</text>
<circle cx="469.55" cy="128" r="7" fill="#b45309" />
<text x="469.55" y="114" font-size="18" fill="#b45309" text-anchor="middle">7</text>
<circle cx="527.64" cy="128" r="7" fill="#b45309" />
<text x="527.64" y="114" font-size="18" fill="#b45309" text-anchor="middle">8</text>
<circle cx="585.73" cy="128" r="7" fill="#b45309" />
<text x="585.73" y="114" font-size="18" fill="#b45309" text-anchor="middle">9</text>
<circle cx="643.82" cy="128" r="7" fill="#b45309" />
<text x="643.82" y="114" font-size="18" fill="#b45309" text-anchor="middle">10</text>
<circle cx="701.91" cy="128" r="7" fill="#b45309" />
<text x="701.91" y="114" font-size="18" fill="#b45309" text-anchor="middle">11</text>
<circle cx="760" cy="128" r="7" fill="#b45309" />
<text x="760" y="114" font-size="18" fill="#b45309" text-anchor="middle">12</text>
<text x="62" y="188" font-size="18" fill="#b45309" text-anchor="end">1.</text>
<text x="70" y="188" font-size="20" fill="#e8eef7" fill-opacity="0.82">four o'clock</text>
<text x="300" y="188" font-size="22" fill="#e8eef7">Bulletin 14 went up</text>
<text x="62" y="208" font-size="18" fill="#b45309" text-anchor="end">2.</text>
<text x="70" y="208" font-size="20" fill="#e8eef7" fill-opacity="0.82">7:15 p.m.</text>
<text x="300" y="208" font-size="22" fill="#e8eef7">I reported a great blue heron</text>
<text x="62" y="228" font-size="18" fill="#b45309" text-anchor="end">3.</text>
<text x="70" y="228" font-size="20" fill="#e8eef7" fill-opacity="0.82">maybe seven-thirty</text>
<text x="300" y="228" font-size="22" fill="#e8eef7" data-kind="unverified">the van left</text>
<text x="62" y="248" font-size="18" fill="#b45309" text-anchor="end">4.</text>
<text x="70" y="248" font-size="20" fill="#e8eef7" fill-opacity="0.82">7:40 p.m.</text>
<text x="300" y="248" font-size="22" fill="#e8eef7">the last visitor vehicle out</text>
<text x="62" y="268" font-size="18" fill="#b45309" text-anchor="end">5.</text>
<text x="70" y="268" font-size="20" fill="#e8eef7" fill-opacity="0.82">7:44 p.m.</text>
<text x="300" y="268" font-size="22" fill="#e8eef7">the pedestrian gate pinned</text>
<text x="62" y="288" font-size="18" fill="#b45309" text-anchor="end">6.</text>
<text x="70" y="288" font-size="20" fill="#e8eef7" fill-opacity="0.82">8 p.m.</text>
<text x="300" y="288" font-size="22" fill="#e8eef7">nothing written on it</text>
<text x="62" y="308" font-size="18" fill="#b45309" text-anchor="end">7.</text>
<text x="70" y="308" font-size="20" fill="#e8eef7" fill-opacity="0.82">8:05 p.m.</text>
<text x="300" y="308" font-size="22" fill="#e8eef7">sending every keeper out in pairs</text>
<text x="62" y="328" font-size="18" fill="#b45309" text-anchor="end">8.</text>
<text x="70" y="328" font-size="20" fill="#e8eef7" fill-opacity="0.82">8:40 p.m.</text>
<text x="300" y="328" font-size="22" fill="#e8eef7">The transfer slip is signed</text>
<text x="62" y="348" font-size="18" fill="#b45309" text-anchor="end">9.</text>
<text x="70" y="348" font-size="20" fill="#e8eef7" fill-opacity="0.82">9:20 p.m.</text>
<text x="300" y="348" font-size="22" fill="#e8eef7">peak gust, 52 miles an hour</text>
<text x="62" y="368" font-size="18" fill="#b45309" text-anchor="end">10.</text>
<text x="70" y="368" font-size="20" fill="#e8eef7" fill-opacity="0.82">9:52 p.m.</text>
<text x="300" y="368" font-size="22" fill="#e8eef7">the gap in Fence Nine</text>
<text x="62" y="388" font-size="18" fill="#b45309" text-anchor="end">11.</text>
<text x="70" y="388" font-size="20" fill="#e8eef7" fill-opacity="0.82">10:05 p.m.</text>
<text x="300" y="388" font-size="22" fill="#e8eef7">north service gate standing open</text>
<text x="62" y="408" font-size="18" fill="#b45309" text-anchor="end">12.</text>
<text x="70" y="408" font-size="20" fill="#e8eef7" fill-opacity="0.82">10:56 p.m.</text>
<text x="300" y="408" font-size="22" fill="#e8eef7">all animals accounted for</text>
</svg>
