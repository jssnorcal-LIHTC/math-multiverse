<text x="38" y="280" font-size="20" fill="#e8eef7" text-anchor="end" dominant-baseline="middle">0</text>
<line x1="48" y1="203.5" x2="752" y2="203.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="38" y="202.67" font-size="20" fill="#e8eef7" text-anchor="end" dominant-baseline="middle">20</text>
<line x1="48" y1="125.5" x2="752" y2="125.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="38" y="125.33" font-size="20" fill="#e8eef7" text-anchor="end" dominant-baseline="middle">40</text>
<line x1="48" y1="48.5" x2="752" y2="48.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="38" y="48" font-size="20" fill="#e8eef7" text-anchor="end" dominant-baseline="middle">60</text>
<rect x="79.68" y="187.2" width="112.64" height="92.8" fill="#b45309" />
<rect x="255.68" y="160.13" width="112.64" height="119.87" fill="#b45309" />
<rect x="431.68" y="109.87" width="112.64" height="170.13" fill="#b45309" />
<rect x="607.68" y="78.93" width="112.64" height="201.07" fill="#b45309" />
<text x="136" y="304" font-size="20" fill="#e8eef7" text-anchor="middle">Seven o'clock</text>
<text x="312" y="304" font-size="20" fill="#e8eef7" text-anchor="middle">eight o'clock</text>
<text x="488" y="304" font-size="20" fill="#e8eef7" text-anchor="middle">nine o'clock</text>
<text x="664" y="304" font-size="20" fill="#e8eef7" text-anchor="middle">9:20 p.m.</text>
<text x="48" y="28" font-size="22" fill="#e8eef7">miles an hour</text>
<text x="48" y="354" font-size="18" fill="#e8eef7" fill-opacity="0.82">gusts of up to 50 miles an hour</text>
<text x="48" y="378" font-size="18" fill="#e8eef7" fill-opacity="0.82">The peak gust of the night is written in the margin beside the grid</text>
<text x="48" y="402" font-size="18" fill="#e8eef7" fill-opacity="0.82">Every reading after ten o'clock falls steadily</text>
<text x="48" y="426" font-size="18" fill="#e8eef7" fill-opacity="0.82">our own wind station and our own evening keeper</text>
</svg>
