<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">STORM RIPS SANCTUARY FENCE</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">The clipping ran in</text>
<text x="252" y="126" font-size="22" fill="#e8eef7">the Valley Register</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">The byline</text>
<text x="252" y="154" font-size="22" fill="#e8eef7">Cal Prentiss</text>
<line x1="78" y1="166.5" x2="722" y2="166.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="204" font-size="22" fill="#e8eef7">A violent spring storm tore a hole in the</text>
<text x="78" y="236" font-size="22" fill="#e8eef7">perimeter fence at Marlowe Creek Wildlife</text>
<line x1="78" y1="276.5" x2="500.17" y2="276.5" stroke="#b45309" stroke-width="2" data-emphasis="underline" />
<text x="78" y="268" font-size="22" fill="#e8eef7">sanctuary records show the fence had not been</text>
<line x1="78" y1="308.5" x2="280.59" y2="308.5" stroke="#b45309" stroke-width="2" data-emphasis="underline" />
<text x="78" y="300" font-size="22" fill="#e8eef7">inspected since March</text>
<line x1="78" y1="340.5" x2="518.47" y2="340.5" stroke="#b45309" stroke-width="2" data-emphasis="underline" />
<text x="78" y="332" font-size="22" fill="#e8eef7">the county was under a High Wind Warning that</text>
<line x1="78" y1="372.5" x2="521.56" y2="372.5" stroke="#b45309" stroke-width="2" data-emphasis="underline" />
<text x="78" y="364" font-size="22" fill="#e8eef7">night, according to the National Weather Service</text>
</svg>
