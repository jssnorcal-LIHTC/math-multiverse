<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">cold-weather trip</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">dated</text>
<text x="226" y="126" font-size="22" fill="#e8eef7">the second of January</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">signed by</text>
<text x="226" y="154" font-size="22" fill="#e8eef7">Osei and Marchetti</text>
<text x="78" y="182" font-size="20" fill="#e8eef7" fill-opacity="0.82">temperature</text>
<text x="226" y="182" font-size="22" fill="#e8eef7">fifteen and twenty-five degrees</text>
<text x="78" y="210" font-size="20" fill="#e8eef7" fill-opacity="0.82">the brief</text>
<text x="226" y="210" font-size="22" fill="#e8eef7">calls a thirty-day battery life</text>
<line x1="78" y1="222.5" x2="722" y2="222.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="268" font-size="22" fill="#e8eef7"><tspan x="78" dy="0">tags</tspan></text>
<text x="400" y="268" font-size="22" fill="#e8eef7"><tspan x="400" dy="0">gone silent</tspan></text>
<line x1="392.5" y1="240" x2="392.5" y2="386" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="280.5" x2="722" y2="280.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="304" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">two of the four tags</tspan></text>
<text x="400" y="304" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">about sixty hours</tspan></text>
<line x1="78" y1="305.5" x2="722" y2="305.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="332" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the other two tags</tspan></text>
<text x="400" y="332" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">lasted into day three</tspan></text>
<line x1="78" y1="333.5" x2="722" y2="333.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="360" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the longest one</tspan></text>
<text x="400" y="360" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">just past sixty-eight</tspan> <tspan x="400" dy="22">hours</tspan></text>
</svg>
