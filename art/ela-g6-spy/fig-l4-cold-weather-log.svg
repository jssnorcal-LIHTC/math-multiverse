<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">cold-weather trip</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">dated</text>
<text x="226" y="126" font-size="22" fill="#e8eef7">the second of January</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">signed by</text>
<text x="226" y="154" font-size="22" fill="#e8eef7">Osei and Marchetti</text>
<text x="78" y="182" font-size="20" fill="#e8eef7" fill-opacity="0.82">temperature</text>
<text x="226" y="182" font-size="22" fill="#e8eef7">fifteen and twenty-five degrees</text>
<line x1="78" y1="194.5" x2="722" y2="194.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<rect x="70" y="210" width="623.2" height="34" fill="none" stroke="#c8102e" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="232" font-size="22" fill="#e8eef7">what the brief calls a thirty-day battery life</text>
<text x="78" y="272" font-size="22" fill="#e8eef7"><tspan x="78" dy="0">tags</tspan></text>
<text x="400" y="272" font-size="22" fill="#e8eef7"><tspan x="400" dy="0">gone silent</tspan></text>
<line x1="392.5" y1="244" x2="392.5" y2="390" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="284.5" x2="722" y2="284.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="308" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">two of the four tags</tspan></text>
<text x="400" y="308" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">about sixty hours</tspan></text>
<line x1="78" y1="309.5" x2="722" y2="309.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="336" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the other two tags</tspan></text>
<text x="400" y="336" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">lasted into day three</tspan></text>
<line x1="78" y1="337.5" x2="722" y2="337.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="364" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the longest one</tspan></text>
<text x="400" y="364" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">just past sixty-eight</tspan> <tspan x="400" dy="22">hours</tspan></text>
<g transform="rotate(-12 559.8 72)">
<rect x="401.6" y="52" width="316.4" height="40" fill="none" stroke="rgba(232,238,247,0.65)" stroke-width="2" rx="4" data-stamp="1" />
<text x="559.8" y="80" font-size="22" fill="#c8102e" text-anchor="middle">not published anywhere</text>
</g>
</svg>
