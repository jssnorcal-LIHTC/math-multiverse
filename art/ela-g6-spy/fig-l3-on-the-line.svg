<text x="62" y="234" font-size="18" fill="#c8102e" text-anchor="end">1.</text>
<text x="70" y="234" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-oh-one</text>
<text x="276" y="234" font-size="22" fill="#e8eef7">Ines went in</text>
<text x="62" y="260" font-size="18" fill="#c8102e" text-anchor="end">2.</text>
<text x="70" y="260" font-size="20" fill="#e8eef7" fill-opacity="0.82">two-nineteen</text>
<text x="276" y="260" font-size="22" fill="#e8eef7">a man in a grey jacket walks in</text>
