<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<text x="40" y="44" font-size="26" fill="#e8eef7">The Halloway exercise</text>
<text x="40" y="134" font-size="18" fill="#e8eef7" fill-opacity="0.82">The rule</text>
<line x1="251" y1="128.5" x2="760" y2="128.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" stroke-dasharray="7 6" />
<text x="40" y="180" font-size="18" fill="#e8eef7" fill-opacity="0.82">I write down times</text>
<line x1="251" y1="174.5" x2="760" y2="174.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" stroke-dasharray="7 6" />
<circle cx="251" cy="174" r="7" fill="#c8102e" />
<text x="251" y="160" font-size="18" fill="#c8102e" text-anchor="middle">1</text>
<circle cx="352.8" cy="128" r="7" fill="#c8102e" />
<text x="352.8" y="114" font-size="18" fill="#c8102e" text-anchor="middle">2</text>
<circle cx="454.6" cy="174" r="7" fill="#c8102e" />
<text x="454.6" y="160" font-size="18" fill="#c8102e" text-anchor="middle">3</text>
<circle cx="556.4" cy="174" r="7" fill="#c8102e" />
<text x="556.4" y="160" font-size="18" fill="#c8102e" text-anchor="middle">4</text>
<circle cx="658.2" cy="128" r="7" fill="#c8102e" />
<text x="658.2" y="114" font-size="18" fill="#c8102e" text-anchor="middle">5</text>
<circle cx="760" cy="174" r="7" fill="#c8102e" />
<text x="760" y="160" font-size="18" fill="#c8102e" text-anchor="middle">6</text>
<text x="62" y="234" font-size="18" fill="#c8102e" text-anchor="end">1.</text>
<text x="70" y="234" font-size="20" fill="#e8eef7" fill-opacity="0.82">ten fourteen</text>
<text x="252" y="234" font-size="22" fill="#e8eef7">Jonah goes in</text>
<text x="62" y="260" font-size="18" fill="#c8102e" text-anchor="end">2.</text>
<text x="70" y="260" font-size="20" fill="#e8eef7" fill-opacity="0.82">ten twenty</text>
<text x="252" y="260" font-size="22" fill="#e8eef7">he checks in at ten twenty</text>
<text x="62" y="286" font-size="18" fill="#c8102e" text-anchor="end">3.</text>
<text x="70" y="286" font-size="20" fill="#e8eef7" fill-opacity="0.82">ten twenty</text>
<text x="252" y="286" font-size="22" fill="#e8eef7">nothing on the radio but the hiss</text>
<text x="62" y="312" font-size="18" fill="#c8102e" text-anchor="end">4.</text>
<text x="70" y="312" font-size="20" fill="#e8eef7" fill-opacity="0.82">ten twenty-one</text>
<text x="252" y="312" font-size="22" fill="#e8eef7">my thumb on the transmit key</text>
<text x="62" y="338" font-size="18" fill="#c8102e" text-anchor="end">5.</text>
<text x="70" y="338" font-size="20" fill="#e8eef7" fill-opacity="0.82">ten twenty-two</text>
<text x="252" y="338" font-size="22" fill="#e8eef7">I call the whole exercise off</text>
<text x="62" y="364" font-size="18" fill="#c8102e" text-anchor="end">6.</text>
<text x="70" y="364" font-size="20" fill="#e8eef7" fill-opacity="0.82">ten twenty-two</text>
<text x="252" y="364" font-size="22" fill="#e8eef7">which is late, the radio clicks twice</text>
</svg>
