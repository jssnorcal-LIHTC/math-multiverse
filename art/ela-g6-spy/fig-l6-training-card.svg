<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">a training card</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">go</text>
<text x="199" y="126" font-size="22" fill="#e8eef7">a folded newspaper carried under the arm</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">stop</text>
<text x="199" y="154" font-size="22" fill="#e8eef7">a scarf taken off</text>
<text x="78" y="182" font-size="20" fill="#e8eef7" fill-opacity="0.82">time limit</text>
<text x="199" y="182" font-size="22" fill="#e8eef7">ten minutes</text>
<text x="78" y="210" font-size="20" fill="#e8eef7" fill-opacity="0.82">fallback</text>
<text x="199" y="210" font-size="22" fill="#e8eef7">the same hour on the next day</text>
<text x="78" y="238" font-size="20" fill="#e8eef7" fill-opacity="0.82">first route</text>
<text x="199" y="238" font-size="22" fill="#e8eef7">out through the front door</text>
<text x="78" y="266" font-size="20" fill="#e8eef7" fill-opacity="0.82">second route</text>
<text x="199" y="266" font-size="22" fill="#e8eef7">through the parking garage</text>
<line x1="78" y1="278.5" x2="722" y2="278.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<rect x="70" y="292" width="128.67" height="32" fill="none" stroke="#c8102e" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="316" font-size="22" fill="#e8eef7">nobody runs</text>
</svg>
