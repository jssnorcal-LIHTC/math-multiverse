<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">The tag did not change</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="22" fill="#e8eef7">the same tracking tag</text>
<text x="288" y="126" font-size="22" fill="#e8eef7">three different climates</text>
<line x1="78" y1="138.5" x2="722" y2="138.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="176" font-size="22" fill="#e8eef7">a number describes one climate, not every climate</text>
<text x="202.37" y="216" font-size="22" fill="#e8eef7"><tspan x="202.37" dy="0">mild coastal</tspan></text>
<text x="375.58" y="216" font-size="22" fill="#e8eef7"><tspan x="375.58" dy="0">desert climate</tspan></text>
<line x1="368.5" y1="188" x2="368.5" y2="350" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="548.79" y="216" font-size="22" fill="#e8eef7"><tspan x="548.79" dy="0">freezing</tspan> <tspan x="548.79" dy="22">mountain</tspan></text>
<line x1="541.5" y1="188" x2="541.5" y2="350" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="250.5" x2="722" y2="250.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="274" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">temperatures</tspan></text>
<text x="202.37" y="274" font-size="20" fill="#e8eef7"><tspan x="202.37" dy="0">in the fifties</tspan></text>
<text x="375.58" y="274" font-size="20" fill="#e8eef7"><tspan x="375.58" dy="0">above ninety</tspan> <tspan x="375.58" dy="22">degrees</tspan></text>
<text x="548.79" y="274" font-size="20" fill="#e8eef7"><tspan x="548.79" dy="0">freezing</tspan></text>
<line x1="78" y1="303.5" x2="722" y2="303.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="324" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">runtime</tspan></text>
<text x="202.37" y="324" font-size="20" fill="#e8eef7"><tspan x="202.37" dy="0">twenty-six days</tspan></text>
<text x="375.58" y="324" font-size="20" fill="#e8eef7"><tspan x="375.58" dy="0">nineteen days</tspan></text>
<text x="548.79" y="324" font-size="20" fill="#e8eef7"><tspan x="548.79" dy="0">just under</tspan> <tspan x="548.79" dy="22">three days</tspan></text>
