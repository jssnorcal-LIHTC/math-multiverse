<text x="78" y="126" font-size="22" fill="#e8eef7">the same tracking tag</text>
<text x="372" y="126" font-size="22" fill="#e8eef7">three different climates</text>
<line x1="78" y1="138.5" x2="722" y2="138.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="176" font-size="20" fill="#e8eef7">a number describes one climate, not every climate</text>
<text x="232.56" y="216" font-size="22" fill="#e8eef7"><tspan x="232.56" dy="0">mild</tspan> <tspan x="232.56" dy="22">coastal</tspan></text>
<text x="395.71" y="216" font-size="22" fill="#e8eef7"><tspan x="395.71" dy="0">desert</tspan> <tspan x="395.71" dy="22">climate</tspan></text>
<line x1="388.5" y1="188" x2="388.5" y2="350" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="558.85" y="216" font-size="22" fill="#e8eef7"><tspan x="558.85" dy="0">freezing</tspan> <tspan x="558.85" dy="22">mountain</tspan></text>
<line x1="551.5" y1="188" x2="551.5" y2="350" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="250.5" x2="722" y2="250.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="274" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">temperatures</tspan></text>
<text x="232.56" y="274" font-size="20" fill="#e8eef7"><tspan x="232.56" dy="0">in the</tspan> <tspan x="232.56" dy="22">fifties</tspan></text>
<text x="395.71" y="274" font-size="20" fill="#e8eef7"><tspan x="395.71" dy="0">above ninety</tspan> <tspan x="395.71" dy="22">degrees</tspan></text>
<text x="558.85" y="274" font-size="20" fill="#e8eef7"><tspan x="558.85" dy="0">freezing</tspan></text>
<line x1="78" y1="297.5" x2="722" y2="297.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="324" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">runtime</tspan></text>
<text x="232.56" y="324" font-size="20" fill="#e8eef7"><tspan x="232.56" dy="0">twenty-six</tspan> <tspan x="232.56" dy="22">days</tspan></text>
<text x="395.71" y="324" font-size="20" fill="#e8eef7"><tspan x="395.71" dy="0">nineteen</tspan> <tspan x="395.71" dy="22">days</tspan></text>
<text x="558.85" y="324" font-size="20" fill="#e8eef7"><tspan x="558.85" dy="0">just under</tspan> <tspan x="558.85" dy="22">three days</tspan></text>
