<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">The tag did not change</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="22" fill="#e8eef7">the same tracking tag</text>
<text x="372" y="126" font-size="22" fill="#e8eef7">three different climates</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">shared</text>
<text x="372" y="154" font-size="22" fill="#e8eef7">all three results together</text>
<line x1="78" y1="166.5" x2="722" y2="166.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="204" font-size="20" fill="#e8eef7">a number describes one climate, not every climate</text>
<text x="232.56" y="244" font-size="22" fill="#e8eef7"><tspan x="232.56" dy="0">mild</tspan> <tspan x="232.56" dy="22">coastal</tspan></text>
<text x="395.71" y="244" font-size="22" fill="#e8eef7"><tspan x="395.71" dy="0">desert</tspan> <tspan x="395.71" dy="22">climate</tspan></text>
<line x1="388.5" y1="216" x2="388.5" y2="378" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="558.85" y="244" font-size="22" fill="#e8eef7"><tspan x="558.85" dy="0">freezing</tspan> <tspan x="558.85" dy="22">mountain</tspan></text>
<line x1="551.5" y1="216" x2="551.5" y2="378" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="278.5" x2="722" y2="278.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="302" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">temperatures</tspan></text>
<text x="232.56" y="302" font-size="20" fill="#e8eef7"><tspan x="232.56" dy="0">in the</tspan> <tspan x="232.56" dy="22">fifties</tspan></text>
<text x="395.71" y="302" font-size="20" fill="#e8eef7"><tspan x="395.71" dy="0">above ninety</tspan> <tspan x="395.71" dy="22">degrees</tspan></text>
<text x="558.85" y="302" font-size="20" fill="#e8eef7"><tspan x="558.85" dy="0">freezing</tspan></text>
<line x1="78" y1="325.5" x2="722" y2="325.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="352" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">runtime</tspan></text>
<text x="232.56" y="352" font-size="20" fill="#e8eef7"><tspan x="232.56" dy="0">twenty-six</tspan> <tspan x="232.56" dy="22">days</tspan></text>
<text x="395.71" y="352" font-size="20" fill="#e8eef7"><tspan x="395.71" dy="0">nineteen</tspan> <tspan x="395.71" dy="22">days</tspan></text>
<text x="558.85" y="352" font-size="20" fill="#e8eef7"><tspan x="558.85" dy="0">just under</tspan> <tspan x="558.85" dy="22">three days</tspan></text>
</svg>
