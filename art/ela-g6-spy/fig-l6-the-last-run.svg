<text x="70" y="260" font-size="20" fill="#e8eef7" fill-opacity="0.82">nine forty-two</text>
<text x="203" y="260" font-size="22" fill="#e8eef7">Okafor follows her out</text>
<text x="62" y="286" font-size="18" fill="#c8102e" text-anchor="end">3.</text>
<text x="70" y="286" font-size="20" fill="#e8eef7" fill-opacity="0.82">nine forty</text>
<text x="203" y="286" font-size="22" fill="#e8eef7">Ines is standing outside the café door</text>
<text x="62" y="312" font-size="18" fill="#c8102e" text-anchor="end">4.</text>
<text x="70" y="312" font-size="20" fill="#e8eef7" fill-opacity="0.82">nine forty-six</text>
<text x="203" y="312" font-size="22" fill="#e8eef7">she comes back the long way</text>
