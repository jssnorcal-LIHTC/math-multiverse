<circle cx="760" cy="174" r="7" fill="#c8102e" />
<text x="760" y="196" font-size="18" fill="#c8102e" text-anchor="middle">4</text>
<text x="62" y="234" font-size="18" fill="#c8102e" text-anchor="end">1.</text>
<text x="70" y="234" font-size="20" fill="#e8eef7" fill-opacity="0.82">nine forty</text>
<text x="203" y="234" font-size="22" fill="#e8eef7">Ines walks in</text>
