<text x="40" y="134" font-size="18" fill="#e8eef7" fill-opacity="0.82">the plan</text>
<line x1="221" y1="128.5" x2="760" y2="128.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" stroke-dasharray="7 6" />
<text x="40" y="180" font-size="18" fill="#e8eef7" fill-opacity="0.82">what actually happens</text>
<line x1="221" y1="174.5" x2="760" y2="174.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" stroke-dasharray="7 6" />
<circle cx="221" cy="128" r="7" fill="#c8102e" />
<text x="221" y="114" font-size="18" fill="#c8102e" text-anchor="middle">1</text>
<circle cx="490.5" cy="128" r="7" fill="#c8102e" />
