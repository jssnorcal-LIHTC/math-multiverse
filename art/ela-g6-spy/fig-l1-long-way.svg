<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<text x="40" y="44" font-size="26" fill="#e8eef7">a surveillance detection run</text>
<line x1="54" y1="124.5" x2="746" y2="124.5" stroke="rgba(232,238,247,0.5)" stroke-width="2" stroke-dasharray="7 6" data-path="line" />
<text x="760" y="44" font-size="18" fill="#e8eef7" text-anchor="end" fill-opacity="0.62">in order, not to scale</text>
<circle cx="54" cy="124" r="13" fill="#c8102e" />
<text x="54" y="131" font-size="18" fill="#0f1218" text-anchor="middle">1</text>
<circle cx="192.4" cy="124" r="13" fill="#c8102e" />
<text x="192.4" y="131" font-size="18" fill="#0f1218" text-anchor="middle">2</text>
<circle cx="330.8" cy="124" r="13" fill="#c8102e" />
<text x="330.8" y="131" font-size="18" fill="#0f1218" text-anchor="middle">3</text>
<circle cx="469.2" cy="124" r="13" fill="#c8102e" />
<text x="469.2" y="131" font-size="18" fill="#0f1218" text-anchor="middle">4</text>
<circle cx="607.6" cy="124" r="13" fill="#c8102e" />
<text x="607.6" y="131" font-size="18" fill="#0f1218" text-anchor="middle">5</text>
<circle cx="746" cy="124" r="13" fill="#c8102e" />
<text x="746" y="131" font-size="18" fill="#0f1218" text-anchor="middle">6</text>
<text x="62" y="176" font-size="18" fill="#c8102e" text-anchor="end">1.</text>
<text x="70" y="176" font-size="22" fill="#e8eef7">a doubling back</text>
<text x="62" y="202" font-size="18" fill="#c8102e" text-anchor="end">2.</text>
<text x="70" y="202" font-size="22" fill="#e8eef7">a stop in front of something that reflects</text>
<text x="62" y="228" font-size="18" fill="#c8102e" text-anchor="end">3.</text>
<text x="70" y="228" font-size="22" fill="#e8eef7">a change of level</text>
<text x="62" y="254" font-size="18" fill="#c8102e" text-anchor="end">4.</text>
<text x="70" y="254" font-size="22" fill="#e8eef7">three sightings in three unrelated places</text>
<text x="62" y="280" font-size="18" fill="#c8102e" text-anchor="end">5.</text>
<text x="70" y="280" font-size="22" fill="#e8eef7">the run is over</text>
<text x="62" y="306" font-size="18" fill="#c8102e" text-anchor="end">6.</text>
<text x="70" y="306" font-size="22" fill="#e8eef7">buys a carton of milk, goes home</text>
