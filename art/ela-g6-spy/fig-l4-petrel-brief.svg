<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">the Petrel-4 tracking tag</text>
<line x1="78" y1="88.5" x2="531.84" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">published by</text>
<text x="224" y="126" font-size="22" fill="#e8eef7">Corvid Systems</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">the brief carries</text>
<text x="224" y="154" font-size="22" fill="#e8eef7">a document number</text>
<text x="78" y="182" font-size="20" fill="#e8eef7" fill-opacity="0.82">date</text>
<text x="224" y="182" font-size="22" fill="#e8eef7">no date anywhere on the page</text>
<line x1="78" y1="194.5" x2="722" y2="194.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<rect x="70" y="208" width="433.79" height="64" fill="none" stroke="#c8102e" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="232" font-size="22" fill="#e8eef7">a fully charged Petrel-4 held a working fix for</text>
<text x="78" y="268" font-size="22" fill="#e8eef7">thirty days straight</text>
<text x="78" y="300" font-size="22" fill="#e8eef7">reported its position on schedule every single time</text>
<line x1="78" y1="340.5" x2="433.48" y2="340.5" stroke="#c8102e" stroke-width="2" data-emphasis="underline" />
<text x="78" y="332" font-size="22" fill="#e8eef7">measured at a constant seventy degrees</text>
<line x1="78" y1="372.5" x2="527.24" y2="372.5" stroke="#c8102e" stroke-width="2" data-emphasis="underline" />
<text x="78" y="364" font-size="22" fill="#e8eef7">battery performance in other conditions may vary</text>
<g transform="rotate(-12 632.92 72)">
<rect x="547.84" y="52" width="170.16" height="40" fill="none" stroke="rgba(232,238,247,0.65)" stroke-width="2" rx="4" data-stamp="1" />
<text x="632.92" y="80" font-size="22" fill="#c8102e" text-anchor="middle">Corvid Systems</text>
</g>
</svg>
