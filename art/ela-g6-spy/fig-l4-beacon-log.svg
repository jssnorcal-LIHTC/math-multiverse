<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">the equipment log</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">dated</text>
<text x="298" y="126" font-size="22" fill="#e8eef7">the fourteenth of March</text>
<text x="78" y="154" font-size="20" fill="#e8eef7" fill-opacity="0.82">signed by</text>
<text x="298" y="154" font-size="22" fill="#e8eef7">Marchetti and Osei</text>
<text x="78" y="182" font-size="20" fill="#e8eef7" fill-opacity="0.82">tunnel</text>
<text x="298" y="182" font-size="22" fill="#e8eef7">the Halloway service tunnel</text>
<text x="78" y="210" font-size="20" fill="#e8eef7" fill-opacity="0.82">the maker's claim</text>
<text x="298" y="210" font-size="22" fill="#e8eef7">ninety minutes</text>
<line x1="78" y1="222.5" x2="722" y2="222.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="268" font-size="22" fill="#e8eef7"><tspan x="78" dy="0">run</tspan></text>
<text x="239" y="268" font-size="22" fill="#e8eef7"><tspan x="239" dy="0">times</tspan></text>
<line x1="231.5" y1="240" x2="231.5" y2="380" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="400" y="268" font-size="22" fill="#e8eef7"><tspan x="400" dy="0">depth</tspan></text>
<line x1="392.5" y1="240" x2="392.5" y2="380" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="561" y="268" font-size="22" fill="#e8eef7"><tspan x="561" dy="0">rock type</tspan></text>
<line x1="553.5" y1="240" x2="553.5" y2="380" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="280.5" x2="722" y2="280.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="304" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the first</tspan> <tspan x="78" dy="22">run</tspan></text>
<text x="239" y="304" font-size="20" fill="#e8eef7"><tspan x="239" dy="0">nine minutes</tspan></text>
<text x="400" y="304" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">the thirty</tspan> <tspan x="400" dy="22">foot level</tspan></text>
<text x="561" y="304" font-size="20" fill="#e8eef7"><tspan x="561" dy="0">wet</tspan> <tspan x="561" dy="22">limestone</tspan></text>
<line x1="78" y1="327.5" x2="722" y2="327.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="354" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the second</tspan> <tspan x="78" dy="22">run</tspan></text>
<text x="239" y="354" font-size="20" fill="#e8eef7"><tspan x="239" dy="0">seven</tspan> <tspan x="239" dy="22">minutes</tspan></text>
<text x="400" y="354" font-size="20" fill="#e8eef7"><tspan x="400" dy="0">the same bay</tspan></text>
<text x="561" y="354" font-size="20" fill="#e8eef7"><tspan x="561" dy="0">wet</tspan> <tspan x="561" dy="22">limestone</tspan></text>
</svg>
