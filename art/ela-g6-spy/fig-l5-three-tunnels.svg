<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Times New Roman', Times, 'Liberation Serif', serif" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">Three conditions differed</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="22" fill="#e8eef7">the same beacon test</text>
<text x="281" y="126" font-size="22" fill="#e8eef7">three different tunnels</text>
<line x1="78" y1="138.5" x2="722" y2="138.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="176" font-size="22" fill="#e8eef7">the beacon is not the thing that changed</text>
<text x="142.9" y="216" font-size="22" fill="#e8eef7"><tspan x="142.9" dy="0">the first tunnel</tspan></text>
<text x="335.93" y="216" font-size="22" fill="#e8eef7"><tspan x="335.93" dy="0">the second tunnel</tspan></text>
<line x1="328.5" y1="188" x2="328.5" y2="334" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="528.97" y="216" font-size="22" fill="#e8eef7"><tspan x="528.97" dy="0">the third tunnel</tspan></text>
<line x1="521.5" y1="188" x2="521.5" y2="334" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="228.5" x2="722" y2="228.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="252" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">rock</tspan></text>
<text x="142.9" y="252" font-size="20" fill="#e8eef7"><tspan x="142.9" dy="0">dry granite</tspan></text>
<text x="335.93" y="252" font-size="20" fill="#e8eef7"><tspan x="335.93" dy="0">wet limestone</tspan></text>
<text x="528.97" y="252" font-size="20" fill="#e8eef7"><tspan x="528.97" dy="0">dry limestone</tspan></text>
<line x1="78" y1="259.5" x2="722" y2="259.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="280" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">shape</tspan></text>
<text x="142.9" y="280" font-size="20" fill="#e8eef7"><tspan x="142.9" dy="0">ran almost straight</tspan></text>
<text x="335.93" y="280" font-size="20" fill="#e8eef7"><tspan x="335.93" dy="0">a sharp bend</tspan></text>
<text x="528.97" y="280" font-size="20" fill="#e8eef7"><tspan x="528.97" dy="0">a gentle curve</tspan></text>
<line x1="78" y1="287.5" x2="722" y2="287.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="308" font-size="20" fill="#e8eef7" fill-opacity="0.82"><tspan x="78" dy="0">result</tspan></text>
<text x="142.9" y="308" font-size="20" fill="#e8eef7"><tspan x="142.9" dy="0">the full life of</tspan> <tspan x="142.9" dy="22">the battery</tspan></text>
<text x="335.93" y="308" font-size="20" fill="#e8eef7"><tspan x="335.93" dy="0">eight minutes</tspan></text>
<text x="528.97" y="308" font-size="20" fill="#e8eef7"><tspan x="528.97" dy="0">fifty-one minutes</tspan></text>
</svg>
