<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
<rect x="0" y="0" width="800" height="450" fill="#0f1218" />
<rect x="56" y="34" width="688" height="386" fill="rgba(232,238,247,0.06)" stroke="rgba(232,238,247,0.28)" stroke-width="1" rx="6" />
<text x="78" y="76" font-size="26" fill="#e8eef7">Three conditions differed</text>
<line x1="78" y1="88.5" x2="722" y2="88.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="126" font-size="20" fill="#e8eef7" fill-opacity="0.82">the same beacon test</text>
<text x="334" y="126" font-size="22" fill="#e8eef7">three different tunnels</text>
<line x1="78" y1="138.5" x2="722" y2="138.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<rect x="70" y="154" width="544" height="34" fill="none" stroke="#c8102e" stroke-width="2" rx="3" data-emphasis="box" />
<text x="78" y="176" font-size="22" fill="#e8eef7">the beacon is not the thing that changed</text>
<text x="78" y="216" font-size="22" fill="#e8eef7"><tspan x="78" dy="0">the first</tspan> <tspan x="78" dy="22">tunnel</tspan></text>
<text x="292.67" y="216" font-size="22" fill="#e8eef7"><tspan x="292.67" dy="0">the second</tspan> <tspan x="292.67" dy="22">tunnel</tspan></text>
<line x1="285.5" y1="188" x2="285.5" y2="378" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="507.33" y="216" font-size="22" fill="#e8eef7"><tspan x="507.33" dy="0">the third</tspan> <tspan x="507.33" dy="22">tunnel</tspan></text>
<line x1="499.5" y1="188" x2="499.5" y2="378" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<line x1="78" y1="250.5" x2="722" y2="250.5" stroke="rgba(232,238,247,0.5)" stroke-width="1" />
<text x="78" y="274" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">dry granite</tspan></text>
<text x="292.67" y="274" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">wet limestone</tspan></text>
<text x="507.33" y="274" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">dry limestone</tspan></text>
<line x1="78" y1="275.5" x2="722" y2="275.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="302" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">ran almost</tspan> <tspan x="78" dy="22">straight</tspan></text>
<text x="292.67" y="302" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">a sharp bend</tspan></text>
<text x="507.33" y="302" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">a gentle curve</tspan></text>
<line x1="78" y1="325.5" x2="722" y2="325.5" stroke="rgba(232,238,247,0.28)" stroke-width="1" />
<text x="78" y="352" font-size="20" fill="#e8eef7"><tspan x="78" dy="0">the full life of</tspan> <tspan x="78" dy="22">the battery</tspan></text>
<text x="292.67" y="352" font-size="20" fill="#e8eef7"><tspan x="292.67" dy="0">eight minutes</tspan></text>
<text x="507.33" y="352" font-size="20" fill="#e8eef7"><tspan x="507.33" dy="0">fifty-one</tspan> <tspan x="507.33" dy="22">minutes</tspan></text>
</svg>
