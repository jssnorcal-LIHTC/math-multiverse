<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c46a4a"/></marker></defs>
<path d="M 241.0,284.9 Q 459.6,58.6 678.2,104.6" fill="none" stroke="#c46a4a" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#ar)" />
<circle cx="241.0" cy="284.9" r="5" fill="#e8eef7" />
<circle cx="242.6" cy="307.0" r="5" fill="#e8eef7" />
<text x="231.0" y="276.9" font-size="17" fill="#e8eef7" text-anchor="end" font-weight="600">Samaria</text>
<text x="232.6" y="323.0" font-size="17" fill="#e8eef7" text-anchor="end" font-weight="600">Jerusalem</text>
<text x="229.0" y="250.9" font-size="18" fill="#8b5e34" text-anchor="end" font-weight="700">ISRAEL</text>
<text x="230.6" y="349.0" font-size="18" fill="#8b5e34" text-anchor="end" font-weight="700">JUDAH</text>
<text x="690.2" y="110.6" font-size="18" fill="#8b5e34" font-weight="700">ASSYRIA</text>
<text x="20.0" y="484.0" font-size="17" fill="#e8eef7">Assyrian armies took Samaria around seven hundred twenty-two BCE.</text>
<text x="20.0" y="508.0" font-size="17" fill="#e8eef7">Assyria then moved many of the defeated people to other parts of its empire.</text>
<text x="20.0" y="536.0" font-size="16" fill="#c46a4a">Assyrian records do not fully agree about which king finished the siege.</text>
<text x="20.0" y="558.0" font-size="16" fill="#c46a4a">This file keeps that disagreement rather than smoothing it away.</text>
</svg>
