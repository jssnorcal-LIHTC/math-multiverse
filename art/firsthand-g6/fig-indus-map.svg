<text x="579.2" y="121.3" font-size="17" fill="#e8eef7" font-weight="600">Harappa</text>
<text x="282.1" y="243.5" font-size="17" fill="#e8eef7" font-weight="600">Mohenjo-daro</text>
<text x="285.5" y="245.8" font-size="17" fill="#4a7fb5" font-weight="600">Indus</text>
<text x="20.0" y="486.0" font-size="17" fill="#e8eef7">Both cities sat on careful grids, with baked-brick homes linked to covered drains.</text>
<text x="20.0" y="510.0" font-size="17" fill="#e8eef7">Their script was cut into thousands of small stone seals.</text>
<text x="20.0" y="532.0" font-size="17" fill="#c46a4a">No scholar has ever managed to read it.</text>
</svg>
