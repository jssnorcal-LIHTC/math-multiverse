<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img">
<rect x="0" y="0" width="900" height="420" fill="#0f1218" />
<text x="24.0" y="40.0" font-size="16" fill="#8b5e34" font-weight="700">ORDER OF EVENTS, AS THIS FILE STATES THEM</text>
<text x="24.0" y="62.0" font-size="15" fill="#e8eef7" fill-opacity="0.66">The passage gives no years, so none are shown.</text>
<line x1="44" y1="96" x2="44" y2="344" stroke="#8b5e34" stroke-width="2.5" />
<circle cx="44" cy="96" r="7.5" fill="#8b5e34" />
<text x="66.0" y="97.0" font-size="17" fill="#e8eef7" font-weight="600">The Babylonian army conquers Judah</text>
<text x="66.0" y="119.0" font-size="16" fill="#e8eef7" fill-opacity="0.82">and destroys the First Temple in Jerusalem.</text>
<circle cx="44" cy="158" r="7.5" fill="#8b5e34" />
<text x="66.0" y="159.0" font-size="17" fill="#e8eef7" font-weight="600">Many Israelites are forced into exile</text>
<text x="66.0" y="181.0" font-size="16" fill="#e8eef7" fill-opacity="0.82">far from their own land.  This is the diaspora.</text>
<circle cx="44" cy="220" r="7.5" fill="#8b5e34" />
<text x="66.0" y="221.0" font-size="17" fill="#e8eef7" font-weight="600">Persian rulers let the exiles return</text>
<text x="66.0" y="243.0" font-size="16" fill="#e8eef7" fill-opacity="0.82">and build a Second Temple on that same site.</text>
<circle cx="44" cy="282" r="7.5" fill="#8b5e34" />
<text x="66.0" y="283.0" font-size="17" fill="#e8eef7" font-weight="600">The Second Temple stands for centuries</text>
<text x="66.0" y="305.0" font-size="16" fill="#e8eef7" fill-opacity="0.82">then a Roman army destroys it during a revolt.</text>
<circle cx="44" cy="344" r="7.5" fill="#8b5e34" />
<text x="66.0" y="345.0" font-size="17" fill="#e8eef7" font-weight="600">Yohanan ben Zakkai opens a school</text>
<text x="66.0" y="367.0" font-size="16" fill="#e8eef7" fill-opacity="0.82">at Yavneh, and teaches with no Temple at all.</text>
</svg>
