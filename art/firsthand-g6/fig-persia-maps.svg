<text x="407.1" y="68.4" font-size="17" fill="#e8eef7" text-anchor="end" font-weight="600">Thermopylae</text>
<text x="407.1" y="88.4" font-size="15" fill="#e8eef7" text-anchor="end" fill-opacity="0.78">a narrow mountain pass</text>
<line x1="410.1" y1="83.4" x2="418.1" y2="91.4" stroke="#e8eef7" stroke-width="1" stroke-opacity="0.5" />
<text x="562.5" y="150.9" font-size="17" fill="#e8eef7" font-weight="600">Plataea</text>
<text x="562.5" y="171.9" font-size="15" fill="#e8eef7" fill-opacity="0.78">open ground</text>
<text x="602.8" y="202.2" font-size="17" fill="#c46a4a" font-weight="600">Salamis</text>
<text x="20.0" y="462.0" font-size="17" fill="#e8eef7">This account credits Sparta with the war’s real turning points.</text>
<text x="20.0" y="486.0" font-size="16" fill="#e8eef7" fill-opacity="0.86">Thermopylae: the stand ended in defeat, but it bought Greece precious time.</text>
<text x="20.0" y="508.0" font-size="16" fill="#e8eef7" fill-opacity="0.86">Plataea: an allied Greek army beat the Persians outright.</text>
<text x="20.0" y="536.0" font-size="16" fill="#c46a4a">Salamis is drawn open because this account treats that sea battle differently.</text>
